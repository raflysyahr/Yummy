name: Build Yummy APK

on:
  push:
    branches:
      - changes/rename-package-name
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Yummy Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Download Bootstrap
        run: ./gradlew downloadBootstraps


      - name: Patch Bootstrap Login for Yummy
        shell: bash
        run: |
          set -euo pipefail

          ZIP="app/src/main/cpp/bootstrap-aarch64.zip"
          TEMP="$(mktemp -d)"
          trap 'rm -rf "$TEMP"' EXIT

          echo "=== Mengekstrak bootstrap ARM64 ==="
          unzip -q "$ZIP" -d "$TEMP"

          LOGIN="$TEMP/bin/login"

          if [ ! -f "$LOGIN" ]; then
            echo "ERROR: bin/login tidak ditemukan"
            exit 1
          fi

          echo "=== Menyesuaikan jalur login ==="
          sed -i 's#/data/data/com\.termux/files/usr#/data/data/com.yummy/files/usr#g' "$LOGIN"

          chmod 700 "$LOGIN"

          echo "=== Memeriksa hasil patch ==="
          head -5 "$LOGIN"

          if grep -n '/data/data/com\.termux/files/usr' "$LOGIN"; then
            echo "ERROR: Masih ditemukan jalur Termux di bin/login"
            exit 1
          fi

          echo "=== Membuat ulang bootstrap ZIP ==="
          (
            cd "$TEMP"
            zip -q -r "$GITHUB_WORKSPACE/$ZIP" .
          )

          echo "Bootstrap ARM64 berhasil disesuaikan."

      - name: Diagnose Legacy Termux Paths
        shell: bash
        run: |
          set -euo pipefail

          ZIP="app/src/main/cpp/bootstrap-aarch64.zip"

          echo "=== Mencari skrip login ==="
          unzip -p "$ZIP" bin/login | head -40

          echo "=== Mencari konfigurasi package ==="
          unzip -Z1 "$ZIP" |
            grep -E '(^|/)(login|termux-login\.sh|profile|bashrc)$' |
            head -100 || true

          echo "=== Memeriksa referensi lama pada file teks ==="
          unzip -Z1 "$ZIP" |
            grep -E '\.(sh|bash|conf|profile|txt)$' |
            while IFS= read -r file; do
              if unzip -p "$ZIP" "$file" 2>/dev/null |
                 grep -q '/data/data/com\.termux'; then
                echo "Ditemukan referensi lama: $file"
              fi
            done

      - name: Diagnose Yummy Bootstrap
        shell: bash
        run: |
          set -euo pipefail

          ZIP="app/src/main/cpp/bootstrap-aarch64.zip"

          echo "=== 1. Memeriksa shell ==="
          unzip -Z1 "$ZIP" |
            grep -E '^bin/(sh|bash|login)$' || true

          echo ""
          echo "=== 2. Memeriksa skrip login ==="
          unzip -p "$ZIP" bin/login | head -60

          echo ""
          echo "=== 3. Memeriksa referensi package lama ==="
          unzip -p "$ZIP" bin/login |
            grep -n 'com.termux' || true

          echo ""
          echo "=== 4. Memeriksa metadata file login ==="
          unzip -Z -v "$ZIP" |
            grep -A 25 -B 3 'bin/login' |
            head -35 || true

      - name: Check Bootstrap Files
        shell: bash
        run: |
          set -euo pipefail
          echo "Memeriksa file bootstrap..."
          ls -lh app/src/main/cpp/bootstrap-*.zip

      - name: Diagnose Bootstrap Login
        shell: bash
        run: |
          set -euo pipefail

          ZIP="app/src/main/cpp/bootstrap-aarch64.zip"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          echo "=== Memeriksa file login di ZIP ==="
          unzip -Z -v "$ZIP" | grep -A 15 -B 5 'bin/login' | head -40 || true

          echo "=== Mengekstrak file login ==="
          unzip -p "$ZIP" bin/login > "$TMP/login"

          echo "=== Informasi file ==="
          ls -l "$TMP/login"
          file "$TMP/login"

          echo "=== Referensi path di binary ==="
          strings "$TMP/login" |
            grep -E '/data/data/com\.(termux|yummy)' |
            head -20 || true

      - name: Inspect Bootstrap Paths
        shell: bash
        run: |
          set -euo pipefail

          ZIP="app/src/main/cpp/bootstrap-aarch64.zip"

          echo "=== Memeriksa file ==="
          test -f "$ZIP"
          ls -lh "$ZIP"

          echo "=== Memeriksa isi ZIP ==="
          unzip -Z1 "$ZIP" | head -40 || true

          echo "=== Mencari referensi path ==="
          unzip -p "$ZIP" |
            strings |
            grep -E -m 30 '/data/data/com\.termux|/data/data/com\.yummy' || true

          echo "=== Pemeriksaan selesai ==="

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Find and Rename ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Daftar APK hasil build ==="
          find app/build/outputs/apk -type f -name '*.apk' -print

          echo "=== Mencari APK ARM64 ==="
          APK="$(find app/build/outputs/apk -type f \
            -name '*arm64-v8a.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "APK ARM64 tidak ditemukan."
            echo "Periksa konfigurasi ABI dan lokasi output Gradle."
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/yummy-arm64-debug.apk

          echo "=== APK yang akan diunggah ==="
          ls -lh dist/yummy-arm64-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yummy-arm64-debug
          path: dist/yummy-arm64-debug.apk
          if-no-files-found: error
          retention-days: 7
