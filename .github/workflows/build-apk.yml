name: Build Yummy APK

on:
  push:
    branches:
      - changes/rename-package-name
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Yummy Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Download Bootstrap
        run: ./gradlew downloadBootstraps
  
      - name: Check Bootstrap Files
        run: |
          echo "Memeriksa file bootstrap..."
          ls -lh app/src/main/cpp/bootstrap-*.zip
      - name: Inspect Bootstrap Paths
        shell: bash
        run: |
          set -euxo pipefail
  
          ZIP="app/src/main/cpp/bootstrap-aarch64.zip"

          echo "=== Memeriksa file ==="
          test -f "$ZIP"
          ls -lh "$ZIP"

          echo "=== Memeriksa ketersediaan perintah ==="
          command -v unzip
          command -v strings

          echo "=== Memeriksa isi ZIP ==="
          unzip -Z1 "$ZIP" | head -40 || true

          echo "=== Mencari referensi path ==="
          unzip -p "$ZIP" | strings | grep -E -m 30 '/data/data/com\.termux|/data/data/com\.yummy' || true

          echo "=== Pemeriksaan selesai ==="










      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yummy-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
